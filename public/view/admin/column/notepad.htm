<df-header>
<script>
var _notepadData = {:json_encode(array_values($output ?: []))};
var _viewUrl     = '{:split_url(str("%s_view",[table_name("NotepadModel")]))}';
var _editUrl     = '{:split_url(str("%s_add",[table_name("NotepadModel")]))}';
var _delUrl      = '{:split_url(str("%s_del",[table_name("NotepadModel")]))}';

document.addEventListener('DOMContentLoaded', function() {
    var table = new Tabulator('#notepad-table', {
        data: _notepadData, layout: 'fitColumns',
        pagination: 'local', paginationSize: 10,
        paginationSizeSelector: [10, 25, 50, 100],
        langs: TABULATOR_ZH, locale: 'zh',
        initialSort: [{column: 'id', dir: 'desc'}],
        columns: [
            {title: '#', field: 'id', width: 60, hozAlign: 'center', headerFilter: false},
            {title: '标题', field: 'title', minWidth: 200, headerFilter: 'input', formatter: function(cell) {
                var d = cell.getRow().getData();
                return '<a href="'+_viewUrl+'/'+d.id+'" class="text-indigo-600 hover:underline">'+cell.getValue()+'</a>';
            }},
            {title: '时间', field: 'time', width: 160},
            {
                title: '操作', width: 220, hozAlign: 'center', headerSort: false, headerFilter: false,
                formatter: function(cell) {
                    var d = cell.getRow().getData();
                    var t = (d.title || '').replace(/'/g, "\'").replace(/"/g, '&quot;');
                    return '<a href="'+_viewUrl+'/'+d.id+'" class="df-btn df-btn-view"><i class="fa fa-eye"></i> 查看</a>'
                         + '<a href="'+_editUrl+'/'+d.id+'" class="df-btn df-btn-edit"><i class="fa fa-edit"></i> 编辑</a>'
                         + '<button onclick="dfDel(\''+_delUrl+'/'+d.id+'\',\''+t+'\')" class="df-btn df-btn-del"><i class="fa fa-trash"></i> 删除</button>';
                }
            }
        ]
    });
    document.getElementById('notepad-search').addEventListener('input', function() {
        var v = this.value;
        if (v) { table.setFilter({field:'title', type:'like', value:v}); }
        else { table.clearFilter(); }
    });
});
</script>
</df-header>

<df-body>
<div class="space-y-4">
    <div class="flex items-center justify-between">
        <h2 class="text-base font-semibold text-slate-800 flex items-center gap-2">
            <i class="fa-solid fa-note-sticky text-indigo-500"></i>记事本
        </h2>
        <a href="{:split_url(str('%s_add',[table_name('NotepadModel')]))}"
           class="inline-flex items-center gap-1.5 px-4 py-2 text-sm font-medium rounded-lg bg-indigo-600 text-white hover:bg-indigo-700 transition-colors shadow-sm">
            <i class="fa-solid fa-plus text-xs"></i>新增记录
        </a>
    </div>
    <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
        <div class="flex items-center gap-3 px-4 py-3 border-b border-slate-100 bg-slate-50">
            <div class="relative">
                <i class="fa-solid fa-magnifying-glass absolute left-2.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs pointer-events-none"></i>
                <input id="notepad-search" type="text" placeholder="搜索标题..."
                       class="pl-8 pr-3 py-1.5 text-sm border border-slate-200 rounded-lg bg-white focus:outline-none focus:ring-2 focus:ring-indigo-400 focus:border-transparent w-56 transition-shadow">
            </div>
            <span class="text-xs text-slate-400 ml-auto">共 {:count($output)} 条</span>
        </div>
        <div id="notepad-table"></div>
    </div>
</div>
</df-body>
