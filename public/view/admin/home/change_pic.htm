<df-body>
<div class="space-y-4">
    <div class="flex items-center justify-between">
        <h2 class="text-base font-semibold text-slate-800 flex items-center gap-2">
            <i class="fa-solid fa-circle-user text-indigo-500"></i>更换头像
        </h2>
    </div>
    <div class="bg-white rounded-xl border border-slate-200 shadow-sm max-w-lg">
        <form method="post" action="{:split_url('admin/home/set_change_pic')}" enctype="multipart/form-data" id="pic-form">
            <input name="data[pic]" id="pic" value="{:$output['pic']??''}" type="hidden">
            <div class="px-6 py-6 flex flex-col items-center gap-4">
                <!-- 预览区 -->
                <div id="uploadPreview1" class="w-28 h-28 rounded-full overflow-hidden border-4 border-slate-100 bg-slate-50 flex items-center justify-center">
                    <df-if isset($output['pic'])>
                    <img src="{$output['pic']}" class="w-full h-full object-cover">
                    <df-else>
                    <i class="fa-solid fa-user text-3xl text-slate-300"></i>
                    </df-if>
                </div>
                <!-- 上传按钮 -->
                <button type="button" id="uploadBut1"
                        class="inline-flex items-center gap-1.5 px-4 py-2 text-sm border border-dashed border-slate-300 rounded-lg text-slate-500 hover:border-indigo-400 hover:text-indigo-600 hover:bg-indigo-50 transition-colors cursor-pointer">
                    <i class="fa-solid fa-upload text-xs"></i>选择图片
                </button>
                <p class="text-xs text-slate-400">支持 JPG / PNG，建议 200×200 以上</p>
            </div>
            <div class="flex items-center gap-3 px-6 py-4 bg-slate-50 rounded-b-xl border-t border-slate-100">
                <button type="submit"
                        class="inline-flex items-center gap-2 px-6 py-2 text-sm font-medium rounded-lg bg-indigo-600 text-white hover:bg-indigo-700 transition-colors shadow-sm">
                    <i class="fa-solid fa-floppy-disk"></i>保存
                </button>
            </div>
        </form>
    </div>
</div>
</df-body>

<df-footer>
<link rel="stylesheet" href="https://oss.dfer.site/webuploader/0.1.5/webuploader.css">
<script src="https://oss.dfer.site/webuploader/0.1.5/webuploader.min.js"></script>
<script>
$(() => { upload('#uploadBut1', '#uploadPreview1', '#pic', '{:split_url("upChangePic")}'); });
</script>
</df-footer>
