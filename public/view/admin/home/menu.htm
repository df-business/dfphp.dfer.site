<df-header>
</df-header>

<df-body>
<div class="space-y-4">

    <!-- 页头 -->
    <div class="flex items-center justify-between flex-wrap gap-2">
        <h2 class="text-base font-semibold text-slate-800 flex items-center gap-2">
            <i class="fa-solid fa-sitemap text-indigo-500"></i>{$title}
        </h2>
        <div class="flex items-center gap-2">
            <a href='{:url("admin","home",table_name("MenuModel")."_add",null,array("parent_id"=>$param,"parent"=>$parent))}'
               class="inline-flex items-center gap-1.5 px-4 py-2 text-sm font-medium rounded-lg bg-indigo-600 text-white hover:bg-indigo-700 transition-colors shadow-sm">
                <i class="fa-solid fa-plus text-xs"></i>新增
            </a>
            <df-if $param>
            <a href='{:url("admin","home",table_name("MenuModel"),$l_parent_id,array("parent"=>$l_parent))}'
               class="inline-flex items-center gap-1.5 px-3 py-2 text-sm rounded-lg border border-slate-200 bg-white text-slate-600 hover:bg-slate-50 transition-colors">
                <i class="fa-solid fa-chevron-left text-xs"></i>返回上级
            </a>
            <a href='{:url("admin","home",table_name("MenuModel"))}'
               class="inline-flex items-center gap-1.5 px-3 py-2 text-sm rounded-lg border border-slate-200 bg-white text-slate-600 hover:bg-slate-50 transition-colors">
                <i class="fa-solid fa-house text-xs"></i>主菜单
            </a>
            </df-if>
        </div>
    </div>

    <!-- 表格卡片 -->
    <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
        <table class="w-full text-sm">
            <thead>
                <tr class="bg-slate-50 border-b border-slate-200 text-slate-500 text-xs font-semibold">
                    <th class="px-4 py-3 text-left w-12">#</th>
                    <th class="px-4 py-3 text-left w-16">ID</th>
                    <th class="px-4 py-3 text-left">标题</th>
                    <th class="px-4 py-3 text-left">路径</th>
                    <th class="px-4 py-3 text-center w-24">排序</th>
                    <th class="px-4 py-3 text-center w-48">操作</th>
                </tr>
            </thead>
            <tbody class="divide-y divide-slate-100">
                <df-each $output>
                <tr class="hover:bg-slate-50 transition-colors">
                    <td class="px-4 py-3 text-slate-400">{$index}</td>
                    <td class="px-4 py-3 text-slate-500">{::id}</td>
                    <td class="px-4 py-3 font-medium text-slate-700">{::title}</td>
                    <td class="px-4 py-3 text-slate-500 max-w-xs truncate">{:urldecode($value['src'])}</td>
                    <td class="px-4 py-3 text-center text-slate-500">{::order_num}</td>
                    <td class="px-4 py-3 text-center whitespace-nowrap">
                        <a {:empty($value['src'])? '' : 'hidden'}
                           href='{:url("admin","home",table_name("MenuModel"),$value[0],array("parent"=>$parent.",".$param))}'
                           class="df-btn df-btn-view"><i class="fa fa-list"></i> 下级</a>
                        <a href='{:url("admin","home",table_name("MenuModel")."_add",$value[0],array("parent_id"=>$param,"parent"=>$parent))}'
                           class="df-btn df-btn-edit"><i class="fa fa-edit"></i> 编辑</a>
                        <df-if param('admin')||$is_df>
                        <a href='{:url("admin","home",table_name("MenuModel")."_del",$value[0],array("parent_id"=>$param,"parent"=>$parent))}'
                           onclick='return confirm("确认要删除吗？")'
                           class="df-btn df-btn-del"><i class="fa fa-trash"></i> 删除</a>
                        </df-if>
                    </td>
                </tr>
                </df-each>
            </tbody>
        </table>
    </div>

</div>
</df-body>
