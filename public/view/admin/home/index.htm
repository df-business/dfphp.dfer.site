<df-header>
<style>
  /* 标签栏隐藏滚动条 */
  .tabs-bar::-webkit-scrollbar { display: none; }
  .tabs-bar { -ms-overflow-style: none; scrollbar-width: none; }
  /* 侧边栏滚动条 */
  .sidebar-nav::-webkit-scrollbar { width: 3px; }
  .sidebar-nav::-webkit-scrollbar-track { background: transparent; }
  .sidebar-nav::-webkit-scrollbar-thumb { background: #334155; border-radius: 2px; }
  /* sidebar 文字过渡 */
  .nav-label { transition: opacity .2s, max-width .2s; overflow: hidden; white-space: nowrap; }
  .sidebar-closed .nav-label { opacity: 0; max-width: 0; }
  .sidebar-closed .df-arrow { display: none !important; }
  /* 展开状态：正常展开；收起状态：由 JS 控制飞出层，不走这里 */
  .df-submenu-open > .df-submenu-children { display: block !important; }
  .df-submenu-open > button .df-arrow { transform: rotate(90deg); }
  /* 飞出层内的 nav-label 必须可见（覆盖 sidebar-closed 的隐藏规则） */
  .df-flyout .nav-label { opacity: 1 !important; max-width: 200px !important; }
  /* 飞出层样式（collapsed 模式下由 JS 设 position:fixed） */
  .df-flyout {
    background: #1e293b;
    border-radius: 10px;
    padding: 4px;
    min-width: 180px;
    box-shadow: 0 8px 32px rgba(0,0,0,.45);
    border: 1px solid rgba(255,255,255,.1);
    margin-left: 0 !important;
    border-left: none !important;
  }
  /* 飞出层里的标题行 */
  .df-flyout-title {
    padding: 6px 10px 4px;
    font-size: 11px;
    font-weight: 600;
    color: #94a3b8;
    letter-spacing: .05em;
    text-transform: uppercase;
  }
</style>
<script>
function adminShell() {
    const DESKTOP = '{:split_url("admin/home/desktop")}';
    return {
        sidebarOpen: localStorage.getItem('df_sidebar') !== '0',

        tabs: [{ id: DESKTOP, title: '起始页', closable: false }],
        activeTabId: DESKTOP,

        init() {
            // 拦截菜单项点击 → 在标签页中打开
            this.$el.addEventListener('click', (e) => {
                const link = e.target.closest('a.df-menu-item');
                if (!link) return;
                e.preventDefault();
                this.openTab(link.href, link.dataset.title || '页面');
            });
        },

        toggleSidebar() {
            this.sidebarOpen = !this.sidebarOpen;
            if (!this.sidebarOpen) {
                // 收起 sidebar 时关闭所有展开的子菜单，避免视觉残留
                document.querySelectorAll('.df-submenu-open').forEach(function(el) {
                    el.classList.remove('df-submenu-open');
                });
            }
            localStorage.setItem('df_sidebar', this.sidebarOpen ? '1' : '0');
        },

        openTab(url, title) {
            const exists = this.tabs.find(t => t.id === url);
            if (exists) {
                this.activeTabId = url;
            } else {
                this.tabs.push({ id: url, title, closable: true });
                this.activeTabId = url;
            }
            this.$nextTick(() => {
                document.querySelector(`.tabs-bar [data-tabid="${CSS.escape(url)}"]`)
                    ?.scrollIntoView({ block: 'nearest', inline: 'nearest' });
            });
        },

        closeTab(id) {
            const idx = this.tabs.findIndex(t => t.id === id);
            this.tabs.splice(idx, 1);
            if (this.activeTabId === id && this.tabs.length > 0) {
                this.activeTabId = this.tabs[Math.max(0, idx - 1)].id;
            }
        },

        refreshTab() {
            const iframe = document.querySelector(`iframe[data-tabid="${CSS.escape(this.activeTabId)}"]`);
            if (iframe) iframe.src = iframe.src;
        }
    };
}

function changeSSL() {
    location.href = "{:SSL_ACTIVE ? str_replace('https','http',URL) : str_replace('http','https',URL)}";
}
</script>
</df-header>

<df-body>
<div x-data="adminShell()" class="flex h-screen bg-slate-100 overflow-hidden">

    <!-- ================================================================ -->
    <!-- SIDEBAR                                                           -->
    <!-- ================================================================ -->
    <aside class="flex flex-col bg-[#0f172a] flex-shrink-0 transition-all duration-300 overflow-hidden z-20"
           :class="sidebarOpen ? 'sidebar-closed-no' : 'sidebar-closed'"
           :style="sidebarOpen ? 'width:220px' : 'width:56px'">

        <!-- 品牌 -->
        <div class="h-14 flex items-center gap-3 px-3.5 border-b border-white/10 flex-shrink-0 overflow-hidden">
            <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center text-white font-bold text-sm flex-shrink-0 select-none">D</div>
            <span class="nav-label text-white font-semibold text-sm" :style="sidebarOpen ? 'opacity:1;max-width:180px' : 'opacity:0;max-width:0'">DfPHP Admin</span>
        </div>

        <!-- 用户信息 -->
        <div class="flex items-center gap-3 px-3 py-3 border-b border-white/10 flex-shrink-0 overflow-hidden">
            <img src="{$user->pic}"
                 class="w-8 h-8 rounded-full border border-white/20 object-cover flex-shrink-0"
                 onerror="this.src='/view/admin/public/assets/img/logo.png'">
            <div class="overflow-hidden transition-all duration-200" :style="sidebarOpen ? 'opacity:1;max-width:180px' : 'opacity:0;max-width:0'">
                <div class="text-white text-xs font-medium truncate">{$user->nm}</div>
                <div class="text-slate-400 text-[11px] truncate">{$user->role_name}</div>
            </div>
        </div>

        <!-- 导航菜单 -->
        <nav class="sidebar-nav flex-1 overflow-y-auto overflow-x-hidden py-2 px-2 space-y-0.5">
            <df-code>$this->menuTree($menu, $where);</df-code>
        </nav>

        <!-- 退出 -->
        <a href="{:split_url('admin/home/ext')}"
           class="flex items-center gap-3 px-3.5 py-3 text-slate-400 hover:text-white hover:bg-white/10 border-t border-white/10 transition-colors text-sm flex-shrink-0 overflow-hidden">
            <i class="fa-solid fa-right-from-bracket w-5 text-center flex-shrink-0"></i>
            <span class="nav-label" :style="sidebarOpen ? 'opacity:1;max-width:180px' : 'opacity:0;max-width:0'">退出登录</span>
        </a>
    </aside>

    <!-- ================================================================ -->
    <!-- MAIN                                                              -->
    <!-- ================================================================ -->
    <div class="flex-1 flex flex-col min-w-0 overflow-hidden">

        <!-- 顶部栏 -->
        <header class="h-14 bg-white border-b border-slate-200 flex items-center gap-2 px-4 flex-shrink-0 z-10"
                style="box-shadow:0 1px 4px rgba(0,0,0,.06)">

            <!-- 折叠按钮 -->
            <button @click="toggleSidebar()"
                    class="w-8 h-8 flex items-center justify-center rounded-lg hover:bg-slate-100 text-slate-500 transition-colors flex-shrink-0">
                <i class="fa-solid fa-bars text-sm"></i>
            </button>

            <div class="flex-1 min-w-0"></div>

            <!-- 留言提醒 -->
            <a href="{:split_url('admin/column/message')}"
               class="df-menu-item relative flex items-center gap-1.5 px-3 py-1.5 text-xs text-slate-500 hover:text-slate-700 hover:bg-slate-100 rounded-lg transition-colors"
               data-title="留言管理">
                <i class="fa-solid fa-envelope"></i>
                <span class="hidden sm:inline">留言</span>
                <df-if count($message) > 0>
                <span class="absolute -top-1 -right-1 min-w-[16px] h-4 px-1 bg-rose-500 text-white text-[10px] rounded-full flex items-center justify-center font-medium">{:count($message)}</span>
                </df-if>
            </a>

            <!-- 刷新服务器缓存 -->
            <button onclick="refreshCache()"
                    class="flex items-center gap-1.5 px-3 py-1.5 text-xs text-slate-500 hover:text-slate-700 hover:bg-slate-100 rounded-lg transition-colors">
                <i class="fa-solid fa-server"></i>
                <span class="hidden sm:inline">刷新缓存</span>
            </button>

            <!-- 前台 -->
            <a href="/" target="_blank"
               class="flex items-center gap-1.5 px-3 py-1.5 text-xs text-slate-500 hover:text-slate-700 hover:bg-slate-100 rounded-lg transition-colors">
                <i class="fa-solid fa-house"></i>
                <span class="hidden md:inline">站点首页</span>
            </a>

            <!-- 刷新当前 tab -->
            <button @click="refreshTab()"
                    class="w-8 h-8 flex items-center justify-center rounded-lg hover:bg-slate-100 text-slate-500 transition-colors"
                    title="刷新当前页">
                <i class="fa-solid fa-rotate-right text-sm"></i>
            </button>

            <!-- 时间 -->
            <div class="text-xs text-slate-400 hidden lg:block px-1">{:date('m-d H:i')}</div>
        </header>

        <!-- 标签栏 -->
        <div class="tabs-bar bg-white border-b border-slate-200 flex items-end gap-0.5 px-3 pt-1.5 flex-shrink-0 overflow-x-auto"
             style="min-height:38px">
            <template x-for="tab in tabs" :key="tab.id">
                <div :data-tabid="tab.id"
                     @click="activeTabId = tab.id"
                     :class="activeTabId === tab.id ? 'bg-white border border-slate-200 border-b-white text-slate-800 font-medium' : 'text-slate-400 hover:text-slate-600 border border-transparent hover:bg-slate-50'"
                     class="flex items-center gap-1.5 px-3 py-1.5 text-xs rounded-t-lg cursor-pointer whitespace-nowrap transition-all -mb-px select-none flex-shrink-0"
                     style="line-height:1.4">
                    <span x-text="tab.title"></span>
                    <button x-show="tab.closable"
                            @click.stop="closeTab(tab.id)"
                            class="w-3.5 h-3.5 flex items-center justify-center rounded hover:bg-slate-200 text-slate-400 hover:text-slate-600 ml-0.5 flex-shrink-0">
                        <i class="fa-solid fa-xmark" style="font-size:9px"></i>
                    </button>
                </div>
            </template>
        </div>

        <!-- iframe 内容区 -->
        <div class="flex-1 relative overflow-hidden">
            <template x-for="tab in tabs" :key="tab.id">
                <iframe :src="tab.id"
                        :data-tabid="tab.id"
                        class="absolute inset-0 w-full h-full border-0 bg-slate-50"
                        :class="activeTabId === tab.id ? 'block' : 'hidden'"
                        frameborder="0"
                        allowfullscreen>
                </iframe>
            </template>
        </div>

        <!-- 底部栏 -->
        <footer class="h-8 bg-white border-t border-slate-200 flex items-center justify-between px-4 text-xs text-slate-400 flex-shrink-0">
            <div class="flex items-center gap-4">
                <span>{:Dfer\Tools\Statics\Common::getBrowser()}</span>
                <button onclick="changeSSL()"
                        class="hover:text-slate-600 transition-colors {:SSL_ACTIVE ? 'text-emerald-500' : ''}">
                    <i class="fa-solid {:SSL_ACTIVE ? 'fa-lock' : 'fa-lock-open'} mr-1"></i>{:SSL_ACTIVE ? 'HTTPS' : 'HTTP'}
                </button>
            </div>
            <div>&copy; 2017–{:date('Y')}
                <a href="http://www.dfer.site" target="_blank" class="hover:text-slate-600 ml-1">dfer.site</a>
            </div>
        </footer>

    </div><!-- /MAIN -->
</div><!-- /adminShell -->

<script>
function refreshCache() {
    if (!confirm('确定刷新服务器缓存？')) return;
    $.post('{:split_url("admin/home/fresh_cache")}', '', function(x) {
        alert(x.msg || (x.status ? '刷新成功' : '刷新失败'));
    });
}

// 关闭所有子菜单并清除飞出层样式
function dfCloseAllSubmenus() {
    document.querySelectorAll('.df-submenu-open').forEach(function(el) {
        el.classList.remove('df-submenu-open');
        var c = el.querySelector('.df-submenu-children');
        if (c) {
            c.classList.remove('df-flyout');
            c.style.cssText = '';
        }
    });
}

function dfToggleMenu(btn) {
    var sub = btn.closest('.df-submenu');
    var isOpen = sub.classList.contains('df-submenu-open');

    // 先关闭所有
    dfCloseAllSubmenus();

    if (isOpen) return; // 点同一个 → 只关闭

    sub.classList.add('df-submenu-open');

    var sidebar = document.querySelector('aside');
    var collapsed = sidebar && sidebar.classList.contains('sidebar-closed');

    if (collapsed) {
        // 飞出层模式：fixed 定位到侧边栏右侧
        var children = sub.querySelector('.df-submenu-children');
        if (!children) return;
        var rect = btn.getBoundingClientRect();
        children.classList.add('df-flyout');
        // 在 children 顶部插入标题（若还没有）
        if (!children.querySelector('.df-flyout-title')) {
            var titleEl = document.createElement('div');
            titleEl.className = 'df-flyout-title';
            titleEl.textContent = btn.querySelector('.nav-label') ? btn.querySelector('.nav-label').textContent : '';
            children.insertBefore(titleEl, children.firstChild);
        }
        var top = rect.top;
        var maxBottom = window.innerHeight - 8;
        // 估算高度，防止超出底部
        var estHeight = children.querySelectorAll('a').length * 36 + 40;
        if (top + estHeight > maxBottom) top = Math.max(8, maxBottom - estHeight);
        children.style.cssText = 'position:fixed;left:' + (rect.right + 6) + 'px;top:' + top + 'px;z-index:9999;display:block!important;';
    }
}

// 点击侧边栏外部时关闭飞出层
document.addEventListener('click', function(e) {
    if (!e.target.closest('.df-submenu') && !e.target.closest('aside')) {
        dfCloseAllSubmenus();
    }
});
</script>
</df-body>
