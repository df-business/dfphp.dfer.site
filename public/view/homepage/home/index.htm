<df-header>
    <title>{$layout['title']} - DfPHP v{:VERSION}</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, /*code {$layout['color']} code*/ 0%, #ffffff 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif;
            color: #333;
        }

        .nav {
            position: fixed; top: 0; left: 0; right: 0; z-index: 100;
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 40px; height: 56px;
            background: rgba(255,255,255,.72);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(0,0,0,.06);
        }
        .nav-brand { font-size: 17px; font-weight: 700; color: #222; text-decoration: none; }
        .nav-links { display: flex; gap: 8px; }
        .nav-links a {
            padding: 6px 14px; border-radius: 6px; font-size: 13px; color: #555;
            text-decoration: none; transition: background .15s;
        }
        .nav-links a:hover { background: rgba(0,0,0,.06); color: #111; }

        .hero { padding: 140px 40px 80px; text-align: center; }
        .hero h1 { font-size: clamp(32px, 5vw, 56px); font-weight: 800; color: #111; margin-bottom: 16px; }
        .hero p  { font-size: 18px; color: #666; max-width: 520px; margin: 0 auto 36px; line-height: 1.7; }
        .hero-actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
        .btn-hero {
            padding: 12px 28px; border-radius: 10px; font-size: 15px;
            text-decoration: none; font-weight: 500; transition: opacity .15s;
        }
        .btn-hero:hover { opacity: .85; }
        .btn-dark  { background: #222; color: #fff; }
        .btn-light { background: rgba(0,0,0,.07); color: #333; }

        .section { max-width: 960px; margin: 0 auto; padding: 0 24px 64px; }
        .section-title {
            font-size: 12px; font-weight: 600; color: #999;
            text-transform: uppercase; letter-spacing: .08em; margin-bottom: 14px;
        }
        .grid { display: grid; gap: 14px; }
        .grid-2 { grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
        .grid-3 { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }

        .card-item {
            background: rgba(255,255,255,.78);
            border: 1px solid rgba(0,0,0,.07);
            border-radius: 12px; padding: 20px 22px;
            backdrop-filter: blur(8px);
            transition: box-shadow .2s, transform .2s;
        }
        .card-item:hover { box-shadow: 0 8px 28px rgba(0,0,0,.10); transform: translateY(-2px); }
        .card-item h3 { font-size: 15px; font-weight: 600; color: #111; margin-bottom: 6px; }
        .card-item p  { font-size: 13px; color: #888; line-height: 1.6; }
        .card-item a  { text-decoration: none; color: inherit; display: block; }

        .link-row {
            display: flex; align-items: center; gap: 10px;
            padding: 12px 16px;
        }
        .link-favicon {
            width: 26px; height: 26px; border-radius: 6px; flex-shrink: 0;
            object-fit: cover;
        }
        .link-name { font-size: 14px; font-weight: 500; color: #222; text-decoration: none; }
        .link-name:hover { color: #4f7cff; }

        .msg-box {
            background: rgba(255,255,255,.78); border: 1px solid rgba(0,0,0,.07);
            border-radius: 12px; padding: 24px; backdrop-filter: blur(8px);
        }
        .msg-box input, .msg-box textarea {
            width: 100%; border: 1px solid #e0e0e0; border-radius: 8px;
            padding: 10px 14px; font-size: 14px; margin-bottom: 12px;
            background: rgba(255,255,255,.9); outline: none; resize: vertical;
            font-family: inherit; transition: border-color .15s;
        }
        .msg-box input:focus, .msg-box textarea:focus { border-color: #4f7cff; }
        .msg-box button {
            padding: 10px 26px; background: #222; color: #fff;
            border: none; border-radius: 8px; font-size: 14px; cursor: pointer;
        }
        .msg-box button:hover { background: #444; }

        .footer {
            text-align: center; padding: 32px 24px;
            font-size: 13px; color: #aaa;
            border-top: 1px solid rgba(0,0,0,.06);
        }
        .footer a { color: #aaa; text-decoration: none; }
        .footer a:hover { color: #555; }
    </style>
</df-header>

<df-body>
    <nav class="nav">
        <a class="nav-brand" href="/">{$layout['title']}</a>
        <div class="nav-links">
            <a href="/homepage/home/readme" target="_blank">开发文档</a>
            <a href="/{:ADMIN_URL}">后台</a>
        </div>
    </nav>

    <div class="hero">
        <h1>{$layout['title']}</h1>
        <p>{$layout['description']}</p>
        <div class="hero-actions">
            <a class="btn-hero btn-dark"  href="/homepage/home/readme" target="_blank">查看文档</a>
            <a class="btn-hero btn-light" href="/{:ADMIN_URL}">进入后台</a>
        </div>
    </div>

    <df-if !empty($column)>
    <div class="section">
        <div class="section-title">文章</div>
        <div class="grid grid-2">
            <df-each $column>
            <div class="card-item">
                <a href="/homepage/home/article?id={::id}">
                    <h3>{::title}</h3>
                    <p>{::describe}</p>
                </a>
            </div>
            </df-each>
        </div>
    </div>
    </df-if>

    <df-if !empty($link)>
    <div class="section">
        <div class="section-title">链接</div>
        <div class="grid grid-3">
            <df-each $link>
            <div class="card-item link-row">
                <img class="link-favicon"
                     src="https://favicon.im/{::src}"
                     onerror="this.src='/favicon.png'"
                     alt="">
                <a class="link-name" href="{::src}" target="_blank">{::title}</a>
            </div>
            </df-each>
        </div>
    </div>
    </df-if>

    <div class="section">
        <div class="section-title">留言</div>
        <div class="msg-box">
            <input id="msg-name" type="text" placeholder="昵称">
            <input id="msg-email" type="email" placeholder="邮箱（选填）">
            <textarea id="msg-content" rows="4" placeholder="留下你的话…"></textarea>
            <button onclick="submitMsg()">提交</button>
        </div>
    </div>

    <div class="footer">
        © 2023–{:Common::getTime(null,'Y')} {$layout['inscribe']} &nbsp;·&nbsp;
        Powered by <a href="https://www.dfer.site" target="_blank">DfPHP</a> v{:VERSION}
    </div>

    <script>
    function submitMsg() {
        var data = {
            name: $('#msg-name').val(),
            content: $('#msg-content').val(),
            e_mail: $('#msg-email').val()
        };
        if (!data.name || !data.content) {
            layui.layer.msg('昵称和内容不能为空');
            return;
        }
        $.post('/homepage/home/postMsg', { data: data }, function(res) {
            if (res.code == 1) {
                layui.layer.msg('留言成功，感谢！');
                $('#msg-name,#msg-email,#msg-content').val('');
            } else {
                layui.layer.msg(res.msg || '提交失败');
            }
        }, 'json');
    }
    </script>
</df-body>

<df-footer>
</df-footer>
