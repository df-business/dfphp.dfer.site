<df-body>
<div class="space-y-4">
    <div class="flex items-center justify-between">
        <h2 class="text-base font-semibold text-slate-800 flex items-center gap-2">
            <i class="fa-solid fa-file-code text-indigo-500"></i>
            {:empty($output[0]) ? '新增静态页面' : '编辑静态页面'}
        </h2>
        <a href="{:split_url('admin/home/'.table_name('HtmlModel'))}"
           class="inline-flex items-center gap-1.5 px-3 py-1.5 text-sm rounded-lg border border-slate-200 bg-white text-slate-600 hover:bg-slate-50 transition-colors">
            <i class="fa-solid fa-arrow-left text-xs"></i>返回列表
        </a>
    </div>
    <div class="bg-white rounded-xl border border-slate-200 shadow-sm">
        <form method="post" action="{:split_url(str('admin/home/%s_update',[table_name('HtmlModel')]))}" id="html-form">
            <input name="id" value="{:$output[0]??'0'}" type="hidden">
            <div class="divide-y divide-slate-100">
                <div class="flex items-start gap-4 px-6 py-4">
                    <label class="w-24 pt-2 text-sm font-medium text-slate-600 shrink-0 text-right">文件名</label>
                    <div class="flex-1">
                        <input type="text" name="data[file_n]" value="{:$output['file_n']??''}" placeholder="如：about"
                               class="w-full max-w-lg px-3 py-2 text-sm border border-slate-200 rounded-lg bg-slate-50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-400 focus:border-transparent transition-shadow">
                        <p class="mt-1 text-xs text-slate-400">访问路径将为 /html/文件名</p>
                    </div>
                </div>
                <div class="flex items-start gap-4 px-6 py-4">
                    <label class="w-24 pt-2 text-sm font-medium text-slate-600 shrink-0 text-right">路径<span class="text-red-500 ml-0.5">*</span></label>
                    <div class="flex-1">
                        <input type="text" name="data[src]" value="{:$output['src']??''}" placeholder="控制器路径"
                               class="w-full max-w-lg px-3 py-2 text-sm border border-slate-200 rounded-lg bg-slate-50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-400 focus:border-transparent transition-shadow">
                    </div>
                </div>
                <div class="flex items-start gap-4 px-6 py-4">
                    <label class="w-24 pt-2 text-sm font-medium text-slate-600 shrink-0 text-right">备注</label>
                    <div class="flex-1">
                        <input type="text" name="data[comment]" value="{:$output['comment']??''}" placeholder="备注说明（可选）"
                               class="w-full max-w-lg px-3 py-2 text-sm border border-slate-200 rounded-lg bg-slate-50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-400 focus:border-transparent transition-shadow">
                    </div>
                </div>
            </div>
            <div class="flex items-center gap-3 px-6 py-4 bg-slate-50 rounded-b-xl border-t border-slate-100">
                <button type="button" onclick="submitHtml()"
                        class="inline-flex items-center gap-2 px-6 py-2 text-sm font-medium rounded-lg bg-indigo-600 text-white hover:bg-indigo-700 transition-colors shadow-sm">
                    <i class="fa-solid fa-floppy-disk"></i>保存
                </button>
                <a href="{:split_url('admin/home/'.table_name('HtmlModel'))}"
                   class="inline-flex items-center gap-1.5 px-4 py-2 text-sm rounded-lg border border-slate-200 bg-white text-slate-600 hover:bg-slate-50 transition-colors">
                    取消
                </a>
            </div>
        </form>
    </div>
</div>
</df-body>

<df-footer>
<script>
function submitHtml() {
    var s = $('[name="data[src]"]').val().trim();
    if (!s) { alert('请输入路径'); $('[name="data[src]"]').focus(); return; }
    $('#html-form').submit();
}
</script>
</df-footer>
