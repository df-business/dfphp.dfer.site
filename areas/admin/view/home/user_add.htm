<df-body>
<div class="space-y-4">
    <div class="flex items-center justify-between">
        <h2 class="text-base font-semibold text-slate-800 flex items-center gap-2">
            <i class="fa-solid fa-user-plus text-indigo-500"></i>
            {:empty($output[0]) ? '新增用户' : '编辑用户'}
        </h2>
        <a href="{:split_url(sprintf('admin/home/%s',table_name('UserModel')))}"
           class="inline-flex items-center gap-1.5 px-3 py-1.5 text-sm rounded-lg border border-slate-200 bg-white text-slate-600 hover:bg-slate-50 transition-colors">
            <i class="fa-solid fa-arrow-left text-xs"></i>返回列表
        </a>
    </div>
    <div class="bg-white rounded-xl border border-slate-200 shadow-sm">
        <form method="post" action="{:split_url(str('admin/home/%s_update',[table_name('UserModel')]))}" id="user-form">
            <input name="id" value="{:$output[0]??'0'}" type="hidden">
            <input name="data[create_time]" value="{:$output['create_time']??Common::getTime()}" type="hidden">
            <div class="divide-y divide-slate-100">
                <div class="flex items-start gap-4 px-6 py-4">
                    <label class="w-20 pt-2 text-sm font-medium text-slate-600 shrink-0 text-right">账号<span class="text-red-500 ml-0.5">*</span></label>
                    <div class="flex-1">
                        <input type="text" name="data[nm]" value="{:$output['nm']??''}" placeholder="登录账号"
                               class="w-full max-w-md px-3 py-2 text-sm border border-slate-200 rounded-lg bg-slate-50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-400 focus:border-transparent transition-shadow">
                    </div>
                </div>
                <div class="flex items-start gap-4 px-6 py-4">
                    <label class="w-20 pt-2 text-sm font-medium text-slate-600 shrink-0 text-right">密码</label>
                    <div class="flex-1">
                        <input type="password" name="data[pw]" value="{:$output['pw']??''}" placeholder="留空则不修改密码"
                               class="w-full max-w-md px-3 py-2 text-sm border border-slate-200 rounded-lg bg-slate-50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-400 focus:border-transparent transition-shadow">
                    </div>
                </div>
                <div class="flex items-start gap-4 px-6 py-4">
                    <label class="w-20 pt-2 text-sm font-medium text-slate-600 shrink-0 text-right">权限角色</label>
                    <div class="flex-1">
                        <select name="data[role]"
                                class="px-3 py-2 text-sm border border-slate-200 rounded-lg bg-slate-50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-400 focus:border-transparent transition-shadow">
                            <df-each $type>
                            <option value="{::id}" {:$v['id']==($output['role']??null)? 'selected' : ''}>{::nm}</option>
                            </df-each>
                        </select>
                    </div>
                </div>
            </div>
            <div class="flex items-center gap-3 px-6 py-4 bg-slate-50 rounded-b-xl border-t border-slate-100">
                <button type="button" onclick="submitUser()"
                        class="inline-flex items-center gap-2 px-6 py-2 text-sm font-medium rounded-lg bg-indigo-600 text-white hover:bg-indigo-700 transition-colors shadow-sm">
                    <i class="fa-solid fa-floppy-disk"></i>保存
                </button>
                <a href="{:split_url(sprintf('admin/home/%s',table_name('UserModel')))}"
                   class="inline-flex items-center gap-1.5 px-4 py-2 text-sm rounded-lg border border-slate-200 bg-white text-slate-600 hover:bg-slate-50 transition-colors">
                    取消
                </a>
            </div>
        </form>
    </div>
</div>
</df-body>

<df-footer>
<script>
function submitUser() {
    var n = $('[name="data[nm]"]').val().trim();
    if (!n) { alert('请输入账号'); $('[name="data[nm]"]').focus(); return; }
    $('#user-form').submit();
}
</script>
</df-footer>
