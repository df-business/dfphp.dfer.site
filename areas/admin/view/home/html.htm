<df-header>
<script>
var _htmlData = {:json_encode(array_values($output ?: []))};
var _editUrl  = '{:split_url(str("%s_add",[table_name("HtmlModel")]))}';
var _delUrl   = '{:split_url(str("%s_del",[table_name("HtmlModel")]))}';

document.addEventListener('DOMContentLoaded', function() {
    var table = new Tabulator('#html-table', {
        data: _htmlData, layout: 'fitColumns',
        pagination: 'local', paginationSize: 10,
        paginationSizeSelector: [10, 25, 50, 100],
        langs: TABULATOR_ZH, locale: 'zh',
        initialSort: [{column: 'id', dir: 'desc'}],
        columns: [
            {title: '#', field: 'id', width: 60, hozAlign: 'center', headerFilter: false},
            {title: '文件名', field: 'file_n', width: 160, headerFilter: 'input', formatter: function(cell) {
                var v = cell.getValue() || '';
                return v ? '<a href="/html/'+v+'" target="_blank" class="text-indigo-600 hover:underline">'+v+'</a>' : '';
            }},
            {title: '路径', field: 'src', minWidth: 200, headerFilter: 'input'},
            {title: '备注', field: 'comment', minWidth: 120, headerFilter: 'input'},
            {
                title: '操作', width: 180, hozAlign: 'center', headerSort: false, headerFilter: false,
                formatter: function(cell) {
                    var d = cell.getRow().getData();
                    var t = (d.file_n || '').replace(/'/g, "\'").replace(/"/g, '&quot;');
                    return '<a href="'+_editUrl+'/'+d.id+'" class="df-btn df-btn-edit"><i class="fa fa-edit"></i> 编辑</a>'
                         + '<button onclick="dfDel(\''+_delUrl+'/'+d.id+'\',\''+t+'\')" class="df-btn df-btn-del"><i class="fa fa-trash"></i> 删除</button>';
                }
            }
        ]
    });
    document.getElementById('html-search').addEventListener('input', function() {
        var v = this.value;
        if (v) { table.setFilter([[{field:'file_n',type:'like',value:v},{field:'src',type:'like',value:v},{field:'comment',type:'like',value:v}]]); }
        else { table.clearFilter(); }
    });
});
</script>
</df-header>

<df-body>
<div class="space-y-4">
    <div class="flex items-center justify-between">
        <h2 class="text-base font-semibold text-slate-800 flex items-center gap-2">
            <i class="fa-solid fa-file-code text-indigo-500"></i>静态页面管理
        </h2>
        <a href="{:split_url(str('%s_add',[table_name('HtmlModel')]))}"
           class="inline-flex items-center gap-1.5 px-4 py-2 text-sm font-medium rounded-lg bg-indigo-600 text-white hover:bg-indigo-700 transition-colors shadow-sm">
            <i class="fa-solid fa-plus text-xs"></i>新增页面
        </a>
    </div>
    <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
        <div class="flex items-center gap-3 px-4 py-3 border-b border-slate-100 bg-slate-50">
            <div class="relative">
                <i class="fa-solid fa-magnifying-glass absolute left-2.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs pointer-events-none"></i>
                <input id="html-search" type="text" placeholder="搜索文件名 / 路径 / 备注..."
                       class="pl-8 pr-3 py-1.5 text-sm border border-slate-200 rounded-lg bg-white focus:outline-none focus:ring-2 focus:ring-indigo-400 focus:border-transparent w-64 transition-shadow">
            </div>
            <span class="text-xs text-slate-400 ml-auto">共 {:count($output)} 条</span>
        </div>
        <div id="html-table"></div>
    </div>
</div>
</df-body>
