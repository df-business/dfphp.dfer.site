<df-body>
<div class="space-y-4">

    <!-- 页头 -->
    <div class="flex items-center justify-between">
        <h2 class="text-base font-semibold text-slate-800 flex items-center gap-2">
            <i class="fa-solid fa-file-lines text-indigo-500"></i>
            {:empty($output[0]) ? '新增文章' : '编辑文章'}
        </h2>
        <a href="{:split_url('admin/column/article')}"
           class="inline-flex items-center gap-1.5 px-3 py-1.5 text-sm rounded-lg border border-slate-200 bg-white text-slate-600 hover:bg-slate-50 transition-colors">
            <i class="fa-solid fa-arrow-left text-xs"></i>返回列表
        </a>
    </div>

    <!-- 表单卡片 -->
    <div class="bg-white rounded-xl border border-slate-200 shadow-sm">
        <form method="post" action="{:split_url('admin/column/article_update')}" id="article-form">
            <input name="id" value="{:$output[0]??'0'}" type="hidden">

            <div class="divide-y divide-slate-100">

                <!-- 标题 -->
                <div class="flex items-start gap-4 px-6 py-4">
                    <label class="w-20 pt-2 text-sm font-medium text-slate-600 shrink-0 text-right">标题<span class="text-red-500 ml-0.5">*</span></label>
                    <div class="flex-1">
                        <input type="text" name="data[title]" value="{:$output['title']??''}"
                               placeholder="请输入文章标题"
                               class="w-full max-w-lg px-3 py-2 text-sm border border-slate-200 rounded-lg bg-slate-50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-400 focus:border-transparent transition-shadow">
                    </div>
                </div>

                <!-- 描述 -->
                <div class="flex items-start gap-4 px-6 py-4">
                    <label class="w-20 pt-2 text-sm font-medium text-slate-600 shrink-0 text-right">描述</label>
                    <div class="flex-1">
                        <input type="text" name="data[describe]" value="{:$output['describe']??''}"
                               placeholder="简短描述（可选）"
                               class="w-full max-w-lg px-3 py-2 text-sm border border-slate-200 rounded-lg bg-slate-50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-400 focus:border-transparent transition-shadow">
                    </div>
                </div>

                <!-- 文件上传 -->
                <div class="flex items-start gap-4 px-6 py-4">
                    <label class="w-20 pt-2 text-sm font-medium text-slate-600 shrink-0 text-right">附件</label>
                    <div class="flex-1">
                        <div class="flex items-center gap-3">
                            <button type="button" id="uploadButton1"
                                    class="inline-flex items-center gap-1.5 px-3 py-1.5 text-sm border border-dashed border-slate-300 rounded-lg text-slate-500 hover:border-indigo-400 hover:text-indigo-600 hover:bg-indigo-50 transition-colors cursor-pointer">
                                <i class="fa-solid fa-paperclip text-xs"></i>选择文件
                            </button>
                            <div id="uploadPreview1" class="text-sm text-slate-500"></div>
                        </div>
                    </div>
                </div>

                <!-- 内容 富文本 -->
                <div class="flex items-start gap-4 px-6 py-4">
                    <label class="w-20 pt-2 text-sm font-medium text-slate-600 shrink-0 text-right">内容<span class="text-red-500 ml-0.5">*</span></label>
                    <div class="flex-1 min-w-0">
                        <script type="text/plain" id="container" name="data[content]">{:$output['content']??''}</script>
                    </div>
                </div>

            </div>

            <!-- 底部操作栏 -->
            <div class="flex items-center gap-3 px-6 py-4 bg-slate-50 rounded-b-xl border-t border-slate-100">
                <button type="button" onclick="return submitArticle()"
                        class="inline-flex items-center gap-2 px-6 py-2 text-sm font-medium rounded-lg bg-indigo-600 text-white hover:bg-indigo-700 active:bg-indigo-800 transition-colors shadow-sm">
                    <i class="fa-solid fa-floppy-disk"></i>保存
                </button>
                <a href="{:split_url('admin/column/article')}"
                   class="inline-flex items-center gap-1.5 px-4 py-2 text-sm rounded-lg border border-slate-200 bg-white text-slate-600 hover:bg-slate-50 transition-colors">
                    取消
                </a>
            </div>

        </form>
    </div>

</div>
</df-body>

<df-footer>

    <!-- umeditor 富文本编辑器 -->
    <link type="text/css" rel="stylesheet" href="https://oss.dfer.site/umeditor/1.2.2/themes/default/css/umeditor.min.css">
    <script src="{:DEFAULT_ADMIN_ASSETS}/umeditor/1.2.2/umeditor.config.js"></script>
    <script src="https://oss.dfer.site/umeditor/1.2.2/umeditor.js"></script>
    <script src="https://oss.dfer.site/umeditor/1.2.2/lang/zh-cn/zh-cn.js"></script>
    <script>var um = UM.getEditor('container');</script>

    <!-- webuploader 文件上传 -->
    <link rel="stylesheet" href="https://oss.dfer.site/webuploader/0.1.5/webuploader.css">
    <script src="https://oss.dfer.site/webuploader/0.1.5/webuploader.min.js"></script>
    <script>
    $(() => {
        upload('#uploadButton1', '#uploadPreview1', '#src', '/admin/column/article_up');
    });

    function submitArticle() {
        var title = $('[name="data[title]"]').val().trim();
        if (!title) {
            alert('请输入文章标题');
            $('[name="data[title]"]').focus();
            return false;
        }
        var content = um ? um.getContent() : '';
        if (!content || content === '<p><br></p>') {
            alert('请输入文章内容');
            return false;
        }
        $('#article-form').submit();
        return true;
    }
    </script>

</df-footer>
