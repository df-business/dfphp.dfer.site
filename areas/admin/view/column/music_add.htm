<df-body>
<div class="space-y-4">
    <div class="flex items-center justify-between">
        <h2 class="text-base font-semibold text-slate-800 flex items-center gap-2">
            <i class="fa-solid fa-music text-indigo-500"></i>
            {:empty($output[0]) ? '新增音乐' : '编辑音乐'}
        </h2>
        <a href="{:split_url(str('admin/column/%s',[areas\admin\model\MusicModel::getName()]))}"
           class="inline-flex items-center gap-1.5 px-3 py-1.5 text-sm rounded-lg border border-slate-200 bg-white text-slate-600 hover:bg-slate-50 transition-colors">
            <i class="fa-solid fa-arrow-left text-xs"></i>返回列表
        </a>
    </div>
    <div class="bg-white rounded-xl border border-slate-200 shadow-sm">
        <form method="post" action="{:split_url(str('admin/column/%s_update',[areas\admin\model\MusicModel::getName()]))}" id="music-form">
            <input name="id" value="{:$output[0]??'0'}" type="hidden">
            <input name="data[src]" id="src" value="{:$output['src']??''}" type="hidden">
            <div class="divide-y divide-slate-100">
                <div class="flex items-start gap-4 px-6 py-4">
                    <label class="w-24 pt-2 text-sm font-medium text-slate-600 shrink-0 text-right">歌曲名<span class="text-red-500 ml-0.5">*</span></label>
                    <div class="flex-1">
                        <input type="text" name="data[title]" value="{:$output['title']??''}" placeholder="歌曲名称"
                               class="w-full max-w-lg px-3 py-2 text-sm border border-slate-200 rounded-lg bg-slate-50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-400 focus:border-transparent transition-shadow">
                    </div>
                </div>
                <div class="flex items-start gap-4 px-6 py-4">
                    <label class="w-24 pt-2 text-sm font-medium text-slate-600 shrink-0 text-right">音乐文件</label>
                    <div class="flex-1 space-y-2">
                        <button type="button" id="uploadBut1"
                                class="inline-flex items-center gap-1.5 px-3 py-1.5 text-sm border border-dashed border-slate-300 rounded-lg text-slate-500 hover:border-indigo-400 hover:text-indigo-600 hover:bg-indigo-50 transition-colors cursor-pointer">
                            <i class="fa-solid fa-music text-xs"></i>选择音乐文件
                        </button>
                        <div id="uploadPreview1" class="text-sm text-slate-500">
                            <df-if isset($output[0])>
                            <audio controls class="mt-1" style="height:36px"><source src="{$output['src']}"></audio>
                            </df-if>
                        </div>
                    </div>
                </div>
            </div>
            <div class="flex items-center gap-3 px-6 py-4 bg-slate-50 rounded-b-xl border-t border-slate-100">
                <button type="button" onclick="submitMusic()"
                        class="inline-flex items-center gap-2 px-6 py-2 text-sm font-medium rounded-lg bg-indigo-600 text-white hover:bg-indigo-700 transition-colors shadow-sm">
                    <i class="fa-solid fa-floppy-disk"></i>保存
                </button>
                <a href="{:split_url(str('admin/column/%s',[areas\admin\model\MusicModel::getName()]))}"
                   class="inline-flex items-center gap-1.5 px-4 py-2 text-sm rounded-lg border border-slate-200 bg-white text-slate-600 hover:bg-slate-50 transition-colors">
                    取消
                </a>
            </div>
        </form>
    </div>
</div>
</df-body>

<df-footer>
<link rel="stylesheet" href="https://oss.dfer.site/webuploader/0.1.5/webuploader.css">
<script src="https://oss.dfer.site/webuploader/0.1.5/webuploader.min.js"></script>
<script>
$(() => { upload('#uploadBut1', '#uploadPreview1', '#src', UPLOAD_API.WEB_UPLOADER); });
function submitMusic() {
    var t = $('[name="data[title]"]').val().trim();
    if (!t) { alert('请输入歌曲名'); $('[name="data[title]"]').focus(); return; }
    $('#music-form').submit();
}
</script>
</df-footer>
