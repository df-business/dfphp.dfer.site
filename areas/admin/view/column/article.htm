<df-header>
<script>
var _articleData = {:json_encode(array_values($output ?: []))};
var _editUrl     = '{:split_url("admin/column/article_add")}';
var _delUrl      = '{:split_url("admin/column/article_del")}';

document.addEventListener('DOMContentLoaded', function() {
    var table = new Tabulator('#article-table', {
        data:              _articleData,
        layout:            'fitColumns',
        responsiveLayout:  'collapse',
        pagination:        'local',
        paginationSize:    10,
        paginationSizeSelector: [10, 25, 50, 100],
        langs:             TABULATOR_ZH,
        locale:            'zh',
        initialSort:       [{ column: 'id', dir: 'desc' }],
        columns: [
            { title: '#',   field: 'id',       width: 60,  hozAlign: 'center', headerFilter: false },
            { title: '标题', field: 'title',    minWidth: 200, headerFilter: 'input' },
            { title: '描述', field: 'describe', minWidth: 160, headerFilter: 'input', formatter: 'textarea' },
            {
                title: '操作', width: 180, hozAlign: 'center', headerSort: false, headerFilter: false,
                formatter: function(cell) {
                    var d   = cell.getRow().getData();
                    var ttl = (d.title || '').replace(/'/g, "\\'").replace(/"/g, '&quot;');
                    return '<a href="' + _editUrl + '/' + d.id + '" class="df-btn df-btn-edit"><i class="fa fa-edit"></i> 编辑</a>'
                         + '<button onclick="dfDel(\'' + _delUrl + '/' + d.id + '\',\'' + ttl + '\')" class="df-btn df-btn-del"><i class="fa fa-trash"></i> 删除</button>';
                }
            }
        ]
    });

    document.getElementById('article-search').addEventListener('input', function() {
        var v = this.value;
        if (v) {
            table.setFilter([[
                { field: 'title',    type: 'like', value: v },
                { field: 'describe', type: 'like', value: v }
            ]]);
        } else {
            table.clearFilter();
        }
    });
});
</script>
</df-header>

<df-body>
<div class="space-y-4">

    <!-- 页头 -->
    <div class="flex items-center justify-between">
        <h2 class="text-base font-semibold text-slate-800 flex items-center gap-2">
            <i class="fa-solid fa-file-lines text-indigo-500"></i>文章管理
        </h2>
        <a href="{:split_url('admin/column/article_add')}"
           class="inline-flex items-center gap-1.5 px-4 py-2 text-sm font-medium rounded-lg bg-indigo-600 text-white hover:bg-indigo-700 transition-colors shadow-sm">
            <i class="fa-solid fa-plus text-xs"></i>新增文章
        </a>
    </div>

    <!-- 表格卡片 -->
    <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">

        <!-- 工具栏 -->
        <div class="flex items-center gap-3 px-4 py-3 border-b border-slate-100 bg-slate-50">
            <div class="relative">
                <i class="fa-solid fa-magnifying-glass absolute left-2.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs pointer-events-none"></i>
                <input id="article-search" type="text" placeholder="搜索标题 / 描述..."
                       class="pl-8 pr-3 py-1.5 text-sm border border-slate-200 rounded-lg bg-white focus:outline-none focus:ring-2 focus:ring-indigo-400 focus:border-transparent w-56 transition-shadow">
            </div>
            <span class="text-xs text-slate-400 ml-auto">共 {:count($output)} 条</span>
        </div>

        <!-- Tabulator 挂载点 -->
        <div id="article-table"></div>
    </div>

</div>
</df-body>
