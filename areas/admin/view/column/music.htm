<df-header>
<script>
var _musicData = {:json_encode(array_values($output ?: []))};
var _editUrl   = '{:split_url(str("admin/column/%s_add",[areas\admin\model\MusicModel::getName()]))}';
var _delUrl    = '{:split_url(str("admin/column/%s_del",[areas\admin\model\MusicModel::getName()]))}';

document.addEventListener('DOMContentLoaded', function() {
    var table = new Tabulator('#music-table', {
        data: _musicData, layout: 'fitColumns',
        pagination: 'local', paginationSize: 10,
        paginationSizeSelector: [10, 25, 50, 100],
        langs: TABULATOR_ZH, locale: 'zh',
        initialSort: [{column: 'id', dir: 'desc'}],
        columns: [
            {title: '#', field: 'id', width: 60, hozAlign: 'center', headerFilter: false},
            {title: '歌曲名', field: 'title', minWidth: 160, headerFilter: 'input'},
            {title: '音乐地址', field: 'src', minWidth: 200, headerFilter: 'input', formatter: function(cell) {
                var v = cell.getValue() || '';
                return v ? '<audio controls style="height:28px;max-width:220px"><source src="'+v+'"></audio>' : '';
            }},
            {
                title: '操作', width: 180, hozAlign: 'center', headerSort: false, headerFilter: false,
                formatter: function(cell) {
                    var d = cell.getRow().getData();
                    var t = (d.title || '').replace(/'/g, "\'").replace(/"/g, '&quot;');
                    return '<a href="'+_editUrl+'/'+d.id+'" class="df-btn df-btn-edit"><i class="fa fa-edit"></i> 编辑</a>'
                         + '<button onclick="dfDel(\''+_delUrl+'/'+d.id+'\',\''+t+'\')" class="df-btn df-btn-del"><i class="fa fa-trash"></i> 删除</button>';
                }
            }
        ]
    });
    document.getElementById('music-search').addEventListener('input', function() {
        var v = this.value;
        if (v) { table.setFilter([[{field:'title',type:'like',value:v},{field:'src',type:'like',value:v}]]); }
        else { table.clearFilter(); }
    });
});
</script>
</df-header>

<df-body>
<div class="space-y-4">
    <div class="flex items-center justify-between">
        <h2 class="text-base font-semibold text-slate-800 flex items-center gap-2">
            <i class="fa-solid fa-music text-indigo-500"></i>音乐管理
        </h2>
        <a href="{:split_url(str('admin/column/%s_add',[areas\admin\model\MusicModel::getName()]))}"
           class="inline-flex items-center gap-1.5 px-4 py-2 text-sm font-medium rounded-lg bg-indigo-600 text-white hover:bg-indigo-700 transition-colors shadow-sm">
            <i class="fa-solid fa-plus text-xs"></i>新增音乐
        </a>
    </div>
    <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
        <div class="flex items-center gap-3 px-4 py-3 border-b border-slate-100 bg-slate-50">
            <div class="relative">
                <i class="fa-solid fa-magnifying-glass absolute left-2.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs pointer-events-none"></i>
                <input id="music-search" type="text" placeholder="搜索歌曲名..."
                       class="pl-8 pr-3 py-1.5 text-sm border border-slate-200 rounded-lg bg-white focus:outline-none focus:ring-2 focus:ring-indigo-400 focus:border-transparent w-56 transition-shadow">
            </div>
            <span class="text-xs text-slate-400 ml-auto">共 {:count($output)} 条</span>
        </div>
        <div id="music-table"></div>
    </div>
</div>
</df-body>
