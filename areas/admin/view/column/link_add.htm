<df-body>
<div class="space-y-4">
    <div class="flex items-center justify-between">
        <h2 class="text-base font-semibold text-slate-800 flex items-center gap-2">
            <i class="fa-solid fa-link text-indigo-500"></i>
            {:empty($output[0]) ? '新增链接' : '编辑链接'}
        </h2>
        <a href="{:split_url(str('admin/column/%s',[areas\admin\model\LinkModel::getName()]))}"
           class="inline-flex items-center gap-1.5 px-3 py-1.5 text-sm rounded-lg border border-slate-200 bg-white text-slate-600 hover:bg-slate-50 transition-colors">
            <i class="fa-solid fa-arrow-left text-xs"></i>返回列表
        </a>
    </div>
    <div class="bg-white rounded-xl border border-slate-200 shadow-sm">
        <form method="post" action="{:split_url(str('admin/column/%s_update',[areas\admin\model\LinkModel::getName()]))}" id="link-form">
            <input name="id" value="{:$output[0]??'0'}" type="hidden">
            <div class="divide-y divide-slate-100">
                <div class="flex items-start gap-4 px-6 py-4">
                    <label class="w-20 pt-2 text-sm font-medium text-slate-600 shrink-0 text-right">名称<span class="text-red-500 ml-0.5">*</span></label>
                    <div class="flex-1">
                        <input type="text" name="data[title]" value="{:$output['title']??''}" placeholder="链接名称"
                               class="w-full max-w-lg px-3 py-2 text-sm border border-slate-200 rounded-lg bg-slate-50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-400 focus:border-transparent transition-shadow">
                    </div>
                </div>
                <div class="flex items-start gap-4 px-6 py-4">
                    <label class="w-20 pt-2 text-sm font-medium text-slate-600 shrink-0 text-right">链接</label>
                    <div class="flex-1">
                        <input type="text" name="data[src]" value="{:$output['src']??''}" placeholder="https://..."
                               class="w-full max-w-lg px-3 py-2 text-sm border border-slate-200 rounded-lg bg-slate-50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-400 focus:border-transparent transition-shadow">
                    </div>
                </div>
            </div>
            <div class="flex items-center gap-3 px-6 py-4 bg-slate-50 rounded-b-xl border-t border-slate-100">
                <button type="button" onclick="submitLink()"
                        class="inline-flex items-center gap-2 px-6 py-2 text-sm font-medium rounded-lg bg-indigo-600 text-white hover:bg-indigo-700 transition-colors shadow-sm">
                    <i class="fa-solid fa-floppy-disk"></i>保存
                </button>
                <a href="{:split_url(str('admin/column/%s',[areas\admin\model\LinkModel::getName()]))}"
                   class="inline-flex items-center gap-1.5 px-4 py-2 text-sm rounded-lg border border-slate-200 bg-white text-slate-600 hover:bg-slate-50 transition-colors">
                    取消
                </a>
            </div>
        </form>
    </div>
</div>
</df-body>

<df-footer>
<script>
function submitLink() {
    var t = $('[name="data[title]"]').val().trim();
    if (!t) { alert('请输入链接名称'); $('[name="data[title]"]').focus(); return; }
    $('#link-form').submit();
}
</script>
</df-footer>
