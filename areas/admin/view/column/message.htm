<df-header>
<script>
var _msgData  = {:json_encode(array_values($output ?: []))};
var _viewUrl  = '{:split_url(str("admin/column/%s_view",[table_name("MessageModel")]))}';
var _delUrl   = '{:split_url(str("admin/column/%s_del",[areas\admin\model\MessageModel::getName()]))}';

document.addEventListener('DOMContentLoaded', function() {
    var table = new Tabulator('#message-table', {
        data: _msgData, layout: 'fitColumns',
        pagination: 'local', paginationSize: 10,
        paginationSizeSelector: [10, 25, 50, 100],
        langs: TABULATOR_ZH, locale: 'zh',
        initialSort: [{column: 'id', dir: 'desc'}],
        columns: [
            {title: '#', field: 'id', width: 60, hozAlign: 'center', headerFilter: false},
            {title: '姓名', field: 'name', width: 100, headerFilter: 'input', formatter: function(cell) {
                var d = cell.getRow().getData();
                return '<a href="'+_viewUrl+'/'+d.id+'" class="text-indigo-600 hover:underline">'+cell.getValue()+'</a>';
            }},
            {title: '联系方式', field: 'e_mail', width: 140, headerFilter: 'input'},
            {title: '内容摘要', field: 'content', minWidth: 200, headerFilter: 'input', formatter: 'textarea'},
            {title: '状态', field: 'status', width: 80, hozAlign: 'center', headerFilter: false, formatter: function(cell) {
                return cell.getValue() ? '<span class="inline-block px-2 py-0.5 rounded text-xs bg-emerald-50 text-emerald-700">已读</span>'
                                       : '<span class="inline-block px-2 py-0.5 rounded text-xs bg-amber-50 text-amber-700">未读</span>';
            }},
            {title: '时间', field: 'time', width: 150},
            {
                title: '操作', width: 180, hozAlign: 'center', headerSort: false, headerFilter: false,
                formatter: function(cell) {
                    var d = cell.getRow().getData();
                    var t = (d.content || '').replace(/'/g, "\'").replace(/"/g, '&quot;').substring(0,20);
                    return '<a href="'+_viewUrl+'/'+d.id+'" class="df-btn df-btn-view"><i class="fa fa-eye"></i> 查看</a>'
                         + '<button onclick="dfDel(\''+_delUrl+'/'+d.id+'\',\''+t+'\')" class="df-btn df-btn-del"><i class="fa fa-trash"></i> 删除</button>';
                }
            }
        ]
    });
    document.getElementById('message-search').addEventListener('input', function() {
        var v = this.value;
        if (v) { table.setFilter([[{field:'name',type:'like',value:v},{field:'content',type:'like',value:v},{field:'e_mail',type:'like',value:v}]]); }
        else { table.clearFilter(); }
    });
});
</script>
</df-header>

<df-body>
<div class="space-y-4">
    <div class="flex items-center justify-between">
        <h2 class="text-base font-semibold text-slate-800 flex items-center gap-2">
            <i class="fa-solid fa-envelope text-indigo-500"></i>留言管理
        </h2>
        <span class="text-sm text-slate-500">共 {:count($output)} 条留言</span>
    </div>
    <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
        <div class="flex items-center gap-3 px-4 py-3 border-b border-slate-100 bg-slate-50">
            <div class="relative">
                <i class="fa-solid fa-magnifying-glass absolute left-2.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs pointer-events-none"></i>
                <input id="message-search" type="text" placeholder="搜索姓名 / 内容 / 联系方式..."
                       class="pl-8 pr-3 py-1.5 text-sm border border-slate-200 rounded-lg bg-white focus:outline-none focus:ring-2 focus:ring-indigo-400 focus:border-transparent w-64 transition-shadow">
            </div>
        </div>
        <div id="message-table"></div>
    </div>
</div>
</df-body>
